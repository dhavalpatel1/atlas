name: Test

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.config.name }}
        runs-on: ${{ matrix.config.runner }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                config:
                    - name: Linux GCC
                      runner: ubuntu-22.04
                      cc: gcc
                      cxx: g++

                    - name: Linux Clang
                      runner: ubuntu-22.04
                      cc: clang
                      cxx: clang++

                    - name: Windows MSVC
                      runner: windows-2022
                      cc: cl
                      cxx: cl
                      generator: "Visual Studio 17 2022"

                    - name: Windows Clang
                      runner: windows-2022
                      cc: clang-cl
                      cxx: clang-cl
                      generator: "Visual Studio 17 2022"

                    - name: Windows MinGW
                      runner: windows-2022
                      cc: gcc
                      cxx: g++
                      generator: "MinGW Makefiles"

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup MSVC
              if: contains(matrix.config.name, 'MSVC') || contains(matrix.config.name, 'Clang')
              uses: ilammy/msvc-dev-cmd@v1

            - name: Setup MinGW
              if: contains(matrix.config.name, 'MinGW')
              run: echo "${{ runner.temp }}\msys64\mingw64\bin" >> $GITHUB_PATH

            - name: Configure
              run: |
                  cmake -B build \
                    -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
                    -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
                    ${{ matrix.config.generator && format('-G "{0}"', matrix.config.generator) || '' }}

            - name: Build
              run: cmake --build build --config Release --parallel

            - name: Test
              working-directory: build
              run: ctest --output-on-failure --parallel --build-config Release

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              if: success() || failure()
              with:
                  name: logs-${{ matrix.config.name }}-${{ github.run_number }}
                  path: |
                      build/**/logs/*.log
                      build/**/logs/*.mocha
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Test Report
              uses: dorny/test-reporter@v1
              if: success() || failure()
              with:
                  name: Test Results (${{ matrix.config.name }})
                  path: build/**/logs/*.mocha
                  reporter: mocha-json
                  fail-on-error: false
